name: ci-build
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
env:
  CARGO_TERM_COLOR: always
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup ndk
        run: |
          # 固定使用 r26b 版本，它对 bindgen 更友好
          wget -O ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -nv
          mkdir -p ~/ndk_temp
          unzip ndk.zip -d ~/ndk_temp 2>&1 > /dev/null
          mv ~/ndk_temp/*/* ~/ndk_temp
      - name: Setup rust toolchains
        run: |
          rustup default nightly
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup component add rust-src
          rustup update
      # 注意：为保证修改生效，暂时移除 rust-cache 步骤
      - name: Install cargo ndk
        run: cargo install cargo-ndk --version 4.1.2
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
      - name: Setup WebUI Deps
        run: |
          npm install next@latest react@latest react-dom@latest
          cd webui
          npm install
      - name: Other deps
        run: |
          sudo apt update
          sudo apt install gcc-multilib clang llvm libbpf-dev
      - name: Build
        run: |
          export ANDROID_NDK_HOME=$(realpath ~/ndk_temp)
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME

          export TARGET_TRIPLE="aarch64-linux-android"
          export NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export NDK_API_LEVEL=31

          # 为 cc crate 和 lua-src 设置交叉编译器
          export CC_${TARGET_TRIPLE//-/_}="$NDK_TOOLCHAIN/bin/${TARGET_TRIPLE}${NDK_API_LEVEL}-clang"
          export AR_${TARGET_TRIPLE//-/_}="$NDK_TOOLCHAIN/bin/llvm-ar"

          # ===== 关键修改：强制 mlua-sys 静态链接 Lua =====
          export LUA_LIB_NAME="lua5.4"
          export LUA_LINK="static"

          # ===== 关键修改：显式传递链接参数 =====
          # 告诉链接器去链接 dl 和 m 库，并导出 Lua 符号
          export RUSTFLAGS="-C link-arg=-ldl -C link-arg=-lm -C link-arg=-rdynamic"

          # 为 binder_ndk_sys / bindgen 设置目标三元组
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=${TARGET_TRIPLE}${NDK_API_LEVEL} --sysroot=$NDK_TOOLCHAIN/sysroot"

          echo "===== Environment Check ====="
          echo "LUA_LIB_NAME = $LUA_LIB_NAME"
          echo "LUA_LINK = $LUA_LINK"
          echo "RUSTFLAGS = $RUSTFLAGS"
          echo "BINDGEN_EXTRA_CLANG_ARGS = $BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android"
          echo "============================="

          cargo xtask build -r -v
      - name: Cleanup
        run: rm -rf ~/ndk_temp
      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/release
          unzip "output/fas-rs(release).zip" -d output/artifact/release
      - name: Upload release version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(release)
          compression-level: 9
          path: output/artifact/release

  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup ndk
        run: |
          wget -O ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -nv
          mkdir -p ~/ndk_temp
          unzip ndk.zip -d ~/ndk_temp 2>&1 > /dev/null
          mv ~/ndk_temp/*/* ~/ndk_temp
      - name: Setup rust toolchains
        run: |
          rustup default nightly
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup component add rust-src
          rustup update
      # 注意：为保证修改生效，暂时移除 rust-cache 步骤
      - name: Install cargo ndk
        run: cargo install cargo-ndk --version 4.1.2
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
      - name: Setup WebUI Deps
        run: |
          npm install next@latest react@latest react-dom@latest
          cd webui
          npm install
      - name: Other deps
        run: |
          sudo apt update
          sudo apt install gcc-multilib clang llvm libbpf-dev
      - name: Build
        run: |
          export ANDROID_NDK_HOME=$(realpath ~/ndk_temp)
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME

          export TARGET_TRIPLE="aarch64-linux-android"
          export NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export NDK_API_LEVEL=31

          export CC_${TARGET_TRIPLE//-/_}="$NDK_TOOLCHAIN/bin/${TARGET_TRIPLE}${NDK_API_LEVEL}-clang"
          export AR_${TARGET_TRIPLE//-/_}="$NDK_TOOLCHAIN/bin/llvm-ar"

          # ===== 关键修改：强制 mlua-sys 静态链接 Lua =====
          export LUA_LIB_NAME="lua5.4"
          export LUA_LINK="static"

          # ===== 关键修改：显式传递链接参数 =====
          export RUSTFLAGS="-C link-arg=-ldl -C link-arg=-lm -C link-arg=-rdynamic"

          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=${TARGET_TRIPLE}${NDK_API_LEVEL} --sysroot=$NDK_TOOLCHAIN/sysroot"

          echo "===== Environment Check ====="
          echo "LUA_LIB_NAME = $LUA_LIB_NAME"
          echo "LUA_LINK = $LUA_LINK"
          echo "RUSTFLAGS = $RUSTFLAGS"
          echo "BINDGEN_EXTRA_CLANG_ARGS = $BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android"
          echo "============================="

          cargo xtask build -v
      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/debug
          unzip "output/fas-rs(debug).zip" -d output/artifact/debug
      - name: Upload debug version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(debug)
          compression-level: 9
          path: output/artifact/debug
