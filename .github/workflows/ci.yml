name: ci-build
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
env:
  CARGO_TERM_COLOR: always
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ===== 修复：NDK 固定到 r26d，不再动态拉 latest =====
      # 原因：NDK r27+ 要求带 API level 的 target triple，
      #       binder_ndk_sys 的 bindgen 传的是不带版本的 triple，
      #       会被 r30 的 sys/cdefs.h 拒绝：
      #       "Unversioned target triples are not supported!"
      - name: Setup ndk
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O ndk.zip
          mkdir -p ~/ndk_temp
          unzip ndk.zip -d ~/ndk_temp 2>&1 > /dev/null
          mv ~/ndk_temp/*/* ~/ndk_temp
      # ====================================================
      # 注意：bpfel-unknown-none 是 Tier 3 目标，rustup 没有预编译构件，
      #       不能使用 `rustup target add bpfel-unknown-none`。
      #       需要在编译时通过 `-Z build-std=core` 从 rust-src 现场构建。
      - name: Setup rust toolchains
        run: |
          rustup default nightly
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup component add rust-src
          rustup update
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo ndk
        run: cargo install cargo-ndk
      # ===== 使用预编译的 bpf-linker =====
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
      # ====================================
      - name: Setup WebUI Deps
        run: |
          npm install next@latest react@latest react-dom@latest
          cd webui
          npm install
      - name: Other deps
        run: |
          sudo apt update
          sudo apt install gcc-multilib clang llvm libbpf-dev
      - name: Build
        run: |
          export ANDROID_NDK_HOME=$(realpath ~/ndk_temp)
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          cargo xtask build -r -v
      - name: Cleanup
        run: rm -rf ~/ndk_temp
      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/release
          unzip "output/fas-rs(release).zip" -d output/artifact/release
      - name: Upload release version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(release)
          compression-level: 9
          path: output/artifact/release

  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ===== 修复：NDK 固定到 r26d，不再动态拉 latest =====
      - name: Setup ndk
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O ndk.zip
          mkdir ~/ndk_temp
          unzip ndk.zip -d ~/ndk_temp 2>&1 > /dev/null
          mv ~/ndk_temp/*/* ~/ndk_temp
      # ====================================================
      - name: Setup rust toolchains
        run: |
          rustup default nightly
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup component add rust-src
          rustup update
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo ndk
        run: cargo install cargo-ndk
      # ===== 使用预编译的 bpf-linker =====
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
      # ====================================
      - name: Setup WebUI Deps
        run: |
          npm install next@latest react@latest react-dom@latest
          cd webui
          npm install
      - name: Other deps
        run: |
          sudo apt update
          sudo apt install gcc-multilib clang llvm libbpf-dev
      - name: Build
        run: |
          export ANDROID_NDK_HOME=$(realpath ~/ndk_temp)
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          cargo xtask build -v
      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/debug
          unzip "output/fas-rs(debug).zip" -d output/artifact/debug
      - name: Upload debug version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(debug)
          compression-level: 9
          path: output/artifact/debug
