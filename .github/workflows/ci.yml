name: ci-build
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
env:
  CARGO_TERM_COLOR: always
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup ndk
        run: |
          # ===== 修改1：固定 NDK 版本为 r26b，避免 r30 的严格检查 =====
          wget -O ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -nv
          mkdir -p ~/ndk_temp
          unzip ndk.zip -d ~/ndk_temp 2>&1 > /dev/null
          mv ~/ndk_temp/*/* ~/ndk_temp
      - name: Setup rust toolchains
        run: |
          rustup default nightly
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup component add rust-src
          rustup update
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo ndk
        # ===== 修改2：固定 cargo-ndk 版本为 4.1.2 =====
        run: cargo install cargo-ndk --version 4.1.2
      # ===== 新增：使用预编译的 bpf-linker =====
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
      # ========================================
      - name: Setup WebUI Deps
        run: |
          npm install next@latest react@latest react-dom@latest
          cd webui
          npm install
      - name: Other deps
        run: |
          sudo apt update
          sudo apt install gcc-multilib clang llvm libbpf-dev
      - name: Build
        run: |
          export ANDROID_NDK_HOME=$(realpath ~/ndk_temp)
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          # ===== 修改3：显式设置 bindgen 环境变量（注意下划线格式） =====
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android31 --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          # ===== 新增：调试输出，确认环境变量已生效 =====
          echo "===== Environment Check ====="
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = $BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android"
          echo "ANDROID_NDK_HOME = $ANDROID_NDK_HOME"
          ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/sys/cdefs.h
          echo "============================="
          cargo xtask build -r -v
      - name: Cleanup
        run: rm -rf ~/ndk_temp
      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/release
          unzip "output/fas-rs(release).zip" -d output/artifact/release
      - name: Upload release version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(release)
          compression-level: 9
          path: output/artifact/release

  debug-build:
    runs-on: ubuntu-latest
    steps:
