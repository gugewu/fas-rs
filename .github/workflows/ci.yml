name: ci-build
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
env:
  CARGO_TERM_COLOR: always
  # 让 bpf-linker / llvm-sys 在源码编译时能找到 LLVM 23
  LLVM_SYS_231_PREFIX: /usr/lib/llvm-23

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r26d
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          NDK_PATH="$RUNNER_TEMP/android-ndk-r26d"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Setup rust toolchains
        run: |
          rustup default nightly
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup component add rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo ndk
        run: cargo install cargo-ndk

      # --- 新增：安装 LLVM 23 开发库，供 bpf-linker 从源码编译时链接 libLLVM ---
      - name: Install LLVM 23 dev files
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y \
            "deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main"
          sudo apt update
          sudo apt install -y llvm-23-dev libclang-23-dev libpolly-23-dev libzstd-dev
          /usr/lib/llvm-23/bin/llvm-config --version

      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker

      # --- 新增：验证 bpf-linker 在 PATH 中可被 build.rs 找到 ---
      - name: Verify bpf-linker
        run: |
          echo "PATH=$PATH"
          which bpf-linker
          bpf-linker --version
          ls -la "$HOME/.cargo/bin/bpf-linker"

      - name: Setup WebUI Deps
        run: |
          npm install next@latest react@latest react-dom@latest
          cd webui
          npm install

      - name: Other deps
        run: |
          sudo apt update
          sudo apt install gcc-multilib clang llvm libbpf-dev

      - name: Build
        env:
          LLVM_SYS_231_PREFIX: /usr/lib/llvm-23
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "LLVM_SYS_231_PREFIX=$LLVM_SYS_231_PREFIX"
          which bpf-linker
          bpf-linker --version
          /usr/lib/llvm-23/bin/llvm-config --version
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" | head -5
          cargo xtask build -r -v

      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/release
          unzip "output/fas-rs(release).zip" -d output/artifact/release

      - name: Upload release version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(release)
          compression-level: 9
          path: output/artifact/release

  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r26d
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          NDK_PATH="$RUNNER_TEMP/android-ndk-r26d"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Setup rust toolchains
        run: |
          rustup default nightly
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup component add rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo ndk
        run: cargo install cargo-ndk

      # --- 新增：安装 LLVM 23 开发库 ---
      - name: Install LLVM 23 dev files
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y \
            "deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main"
          sudo apt update
          sudo apt install -y llvm-23-dev libclang-23-dev libpolly-23-dev libzstd-dev
          /usr/lib/llvm-23/bin/llvm-config --version

      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker

      # --- 新增：验证 bpf-linker ---
      - name: Verify bpf-linker
        run: |
          echo "PATH=$PATH"
          which bpf-linker
          bpf-linker --version
          ls -la "$HOME/.cargo/bin/bpf-linker"

      - name: Setup WebUI Deps
        run: |
          npm install next@latest react@latest react-dom@latest
          cd webui
          npm install

      - name: Other deps
        run: |
          sudo apt update
          sudo apt install gcc-multilib clang llvm libbpf-dev

      - name: Build
        env:
          LLVM_SYS_231_PREFIX: /usr/lib/llvm-23
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "LLVM_SYS_231_PREFIX=$LLVM_SYS_231_PREFIX"
          which bpf-linker
          bpf-linker --version
          /usr/lib/llvm-23/bin/llvm-config --version
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" | head -5
          cargo xtask build -v

      - name: Prepare artifacts
        run: |
          mkdir -p output/artifact/debug
          unzip "output/fas-rs(debug).zip" -d output/artifact/debug

      - name: Upload debug version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(debug)
          compression-level: 9
          path: output/artifact/debug
