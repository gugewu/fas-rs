[workspace]
members = ["xtask"]

[package]
name = "fas-rs"
version = "4.9.1"
edition = "2024"
description = "Frame aware scheduling for android. Requires kernel ebpf support."
authors = ["shadow3"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/shadow3aaa/fas-rs"

[dependencies]
likely_stable = "0.1.3"
parking_lot = "0.12.5"
thiserror = "2.0.18"
log = "0.4.29"
anyhow = { version = "1.0.101" }
inotify = { version = "0.11.0", default-features = false }
flexi_logger = "0.31.8"
libc = "0.2.180"
toml = "1.0.3"
serde = { version = "1.0.228", features = ["derive"] }
sys-mount = { version = "3.0.1", default-features = false }
quick-xml = { version = "0.39.0", features = ["serialize"] }
mlua = { version = "0.11.6", features = ["luajit", "vendored", "error-send"] }
frame-analyzer = { git = "https://github.com/gugewu/frame-analyzer-ebpf" }
dumpsys-rs = { git = "https://github.com/shadow3aaa/dumpsys-rs" }
mimalloc = { version = "0.1.48", features = ["no_thp", "override"] }
num_cpus = "1.17.0"
nix = { version = "0.31.1", features = ["sched"] }
sysinfo = "0.32.0"

[build-dependencies]
anyhow = "1.0.101"
toml = "1.0.3"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
rocket = { version = "0.5.0", features = ["json"] }

[profile.dev]
overflow-checks = false
opt-level = 3
strip = true

[profile.release]
overflow-checks = false
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
